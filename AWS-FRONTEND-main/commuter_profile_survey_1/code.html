<div class="flex grow flex-col">

</div>

</label>
<label class="group flex items-center gap-4 rounded-xl border-2 border-slate-200 dark:border-slate-800 p-4 transition-all hover:border-primary/50 cursor-pointer has-[:checked]:border-primary has-[:checked]:bg-primary/5">
<input class="h-5 w-5 border-2 border-slate-300 dark:border-slate-700 bg-transparent text-primary focus:ring-primary focus:ring-offset-0 checked:bg-[image:--radio-dot-svg]" name="commuter-type" type="radio"/>
<div class="flex grow flex-col">
<p class="text-slate-900 dark:text-slate-100 text-base font-bold">Person with Disability</p>

<button class="w-full bg-primary hover:bg-primary/90 text-white font-bold py-4 rounded-xl transition-colors shadow-lg shadow-primary/20">
