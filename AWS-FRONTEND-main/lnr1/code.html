<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>SafeTravel PH - Login &amp; Registration</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#136dec",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101822",
                    },
                    fontFamily: {
                        "display": ["Public Sans", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Public Sans', sans-serif;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 min-h-screen flex flex-col">
<div class="relative flex h-full min-h-screen w-full flex-col bg-background-light dark:bg-background-dark overflow-x-hidden">
<!-- Header Section -->
<div class="flex items-center p-4 pb-2 justify-between">
<div class="text-slate-900 dark:text-slate-100 flex size-12 shrink-0 items-center justify-start">
<span class="material-symbols-outlined text-2xl">arrow_back_ios</span>
</div>
<h2 class="text-slate-900 dark:text-slate-100 text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center pr-12 font-display">SafeTravel PH</h2>
</div>
<!-- Hero Content -->
<div class="flex flex-col items-center px-6 pt-10 pb-6">
<div class="w-20 h-20 bg-primary/20 rounded-2xl flex items-center justify-center mb-6">
<span class="material-symbols-outlined text-primary text-5xl">shield_with_heart</span>
</div>
<h1 class="text-slate-900 dark:text-slate-100 tracking-tight text-[32px] font-bold leading-tight text-center pb-2 font-display">Welcome Back</h1>
<p class="text-slate-600 dark:text-slate-400 text-base font-normal leading-normal text-center max-w-[300px]">Log in to access safe routes and real-time disaster alerts.</p>
</div>
<!-- Login Form -->
<div class="flex flex-col gap-4 px-6 py-4 w-full max-w-[480px] mx-auto">
<label class="flex flex-col w-full">
<p class="text-slate-700 dark:text-slate-300 text-sm font-medium leading-normal pb-2 ml-1">Email or Username</p>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-slate-400 text-xl">mail</span>
</div>
<input class="form-input flex w-full rounded-xl text-slate-900 dark:text-slate-100 focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 h-14 placeholder:text-slate-400 pl-11 text-base font-normal" placeholder="username@email.com" type="text"/>
</div>
</label>
<label class="flex flex-col w-full">
<p class="text-slate-700 dark:text-slate-300 text-sm font-medium leading-normal pb-2 ml-1">Password</p>
<div class="flex w-full items-stretch relative">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-slate-400 text-xl">lock</span>
</div>
<input class="form-input flex w-full rounded-xl text-slate-900 dark:text-slate-100 focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 h-14 placeholder:text-slate-400 pl-11 pr-12 text-base font-normal" placeholder="Enter your password" type="password"/>
<button class="absolute inset-y-0 right-0 pr-4 flex items-center text-slate-400 hover:text-primary transition-colors">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</label>
<div class="flex justify-end px-1">
<a class="text-primary text-sm font-semibold hover:underline" href="#">Forgot Password?</a>
</div>
<!-- Action Buttons -->
<div class="flex flex-col gap-3 pt-6">
<button class="w-full bg-primary hover:bg-primary/90 text-white font-bold py-4 rounded-xl shadow-lg shadow-primary/20 transition-all active:scale-[0.98]">
                    Log In
                </button>
<div class="relative flex items-center py-4">
<div class="flex-grow border-t border-slate-200 dark:border-slate-800"></div>
<span class="flex-shrink mx-4 text-slate-400 text-sm font-medium">OR</span>
<div class="flex-grow border-t border-slate-200 dark:border-slate-800"></div>
</div>
<div class="grid grid-cols-2 gap-3">
<button class="flex items-center justify-center gap-2 border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 py-3 rounded-xl hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors">
<img alt="Google" class="w-5 h-5" data-alt="Google colorful logo icon" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAL4lbpfvFxblr-n_zFevFfmw7sQAtKt78tTc6iPGEc7utLjVdnourYH3PHkOH4M6Qja44Ic22keVncTtA-T5_6UBRHivdziDCSiLwc3HTdHXBJ6ZmElwI0QuS0bu7wNjhipY_tLSOo4-wRfrClhENe5ryseooiKshoawLnAkedWuzv9g05x_y6d6qCMWMo8lRASbUoIu8LsXCSi9b-mx-L5dkMGJ3VjHdUY2rXkhCKdfOf2RTEcnXXdWEQBr0kmDxlCDcWomuHnuI"/>
<span class="text-sm font-semibold">Google</span>
</button>
<button class="flex items-center justify-center gap-2 border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 py-3 rounded-xl hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors">
<span class="material-symbols-outlined text-black dark:text-white">ios</span>
<span class="text-sm font-semibold">Apple ID</span>
</button>
</div>
</div>
</div>
<!-- Registration Footer -->
<div class="mt-auto pb-10 px-6 text-center">
<p class="text-slate-600 dark:text-slate-400 text-sm">
                Don't have an account? 
                <a class="text-primary font-bold hover:underline" href="#">Sign Up Now</a>
</p>
</div>
<!-- Decorative Map Element (Low Opacity) -->
<div class="absolute bottom-0 left-0 w-full h-1/4 opacity-10 pointer-events-none overflow-hidden grayscale">
<img alt="Manila Map" class="w-full h-full object-cover" data-alt="Abstract aerial map of Metro Manila streets" data-location="Manila, Philippines" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCxp8qnCVFRyzzvqQFp2_lSAuyZnCBU0LBdPhViA23A1Uwju7axDifV8ZJf7f9Ptl26fwSHdNEgeQmhbJ6xWBhqXgOt14OHNeaSEm_mrgwoMpDk2WDZtr4EnvGqHHAb_CnqowOA1i_atlz0Wm9PV2y-ZeHzbU-l4XgK9AwLBTrQ6X3hPnH1R1ne4m-XLfUnGsApILzxiJZg0N0BJ_cYM8DGBVnFu9w2W1Ft3FNsMAXMO1mfEk_3aqmBRE99kShbXJVQiOzc_0Z4nMI"/>
<div class="absolute inset-0 bg-gradient-to-t from-background-light dark:from-background-dark to-transparent"></div>
</div>
</div>
</body></html>
