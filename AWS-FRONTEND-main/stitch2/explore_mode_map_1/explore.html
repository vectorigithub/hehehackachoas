<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Explore — Ligtas</title>

  <!--external css -->
  <link rel="stylesheet" href="../../../main.css" />
  <!--external js-->
  <script src="../../../main.js"></script>
  
  <!--Leaflet CSS for OpenStreetMap-->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" 
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" 
    crossorigin=""/>
  <!--Leaflet JS-->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" 
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" 
    crossorigin=""></script>
  
  <!--specific js-->
  <script src="explore.js" defer></script>

  <style>
    /* ALL LAYOUT & COMPONENTS
       This page owns its full layout. Nothing here is shared.
       Colors, fonts, buttons, toggles → from main.css.
       Positioning, structure, page-specific components → here. */

    :root {
      --bg:           #f0f4f8;
      --card:         #ffffff;
      --card2:        #f5f8fb;
      --header-blur:  rgba(255,255,255,0.85);
      --border:       #e0e8f0;
      --border2:      #c8d8e8;
      --divider:      #eef2f7;
      --text:         #0f1f35;
      --text2:        #7a94ad;
      --text3:        #a0b4c8;
      --teal:         #0d9e9e;
      --teal-light:   #0fb9b9;
      --teal-dim:     rgba(13,158,158,0.10);
      --teal-glow:    rgba(13,158,158,0.30);
      --green:        #34d399;
      --green-dim:    rgba(52,211,153,0.12);
      --red:          #f43f5e;
      --red-dim:      rgba(244,63,94,0.10);
      --yellow:       #facc15;
      --yellow-dim:   rgba(250,204,21,0.12);
      --icon-bg:      #eef4fb;
      --toggle-off:   #d0dce8;
      --r-sm:   6px;  --r-md:  12px;
      --r-lg:  16px;  --r-xl:  24px;
      --r-full: 9999px;
    }

    [data-theme="dark"] {
      --bg:           #0b1120;
      --card:         #111c2e;
      --card2:        #162030;
      --header-blur:  rgba(11,17,32,0.85);
      --border:       #1e3a5f;
      --border2:      #1a2d47;
      --divider:      #1a2d47;
      --text:         #e8f0f8;
      --text2:        #6b8aad;
      --text3:        #4a6080;
      --teal:         #12d9c0;
      --teal-light:   #1aefcf;
      --teal-dim:     rgba(18,217,192,0.10);
      --teal-glow:    rgba(18,217,192,0.25);
      --green:        #34d399;
      --green-dim:    rgba(52,211,153,0.12);
      --red:          #fb7185;
      --red-dim:      rgba(251,113,133,0.12);
      --yellow:       #fde047;
      --yellow-dim:   rgba(253,224,71,0.12);
      --icon-bg:      #1a2d47;
      --toggle-off:   #2a3d56;
    }

    .icon-svg {
      display: inline-block; vertical-align: middle;
      stroke: currentColor; fill: none;
      stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
      flex-shrink: 0;
    }

    /*pstage*/
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #e8f0f8 0%, #f0f4f8 50%, #e4eef7 100%);
    }
    [data-theme="dark"] body {
      background: linear-gradient(135deg, #060d1a 0%, #0b1120 50%, #071018 100%);
    }

    /*pframe*/
    .phone {
      position: relative;
      width: 390px; height: 844px;
      border-radius: 44px;
      background: var(--bg);
      border: 2px solid var(--border2);
      box-shadow: 0 40px 100px rgba(13,100,100,0.18), 0 0 0 1px rgba(255,255,255,0.7) inset, 0 0 60px rgba(13,158,158,0.08);
      overflow: hidden;
      display: flex; flex-direction: column;
      transition: background 0.3s, border-color 0.3s;
    }
    [data-theme="dark"] .phone {
      box-shadow: 0 40px 100px rgba(0,0,0,0.7), 0 0 0 1px rgba(255,255,255,0.03) inset, 0 0 60px rgba(18,217,192,0.06);
    }

    /*map container*/
    .map-container {
      position: relative;
      flex: 1;
      background: #e5e3df;
      overflow: hidden;
    }
    #map {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    /* Hide Leaflet attribution to keep UI clean */
    .leaflet-control-attribution {
      font-size: 8px;
      background: rgba(255,255,255,0.7);
      padding: 2px 4px;
    }

    .search-header {
      position: absolute;
      top: 0; left: 0; right: 0;
      padding: 48px 16px 12px;
      z-index: 100;
      transition: all 0.3s;
      pointer-events: none;
    }

    .search-header > * {
      pointer-events: auto;
    }

    .search-row {
      display: flex;
      gap: 8px;
      margin-bottom: 0;
      width: 100%;
      align-items: center;
    }

    .search-bar {
      display: flex; align-items: center; gap: 8px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--r-md);
      padding: 12px 14px;
      box-shadow: 0 2px 8px rgba(13,60,100,0.12);
      transition: all 0.25s;
      flex: 1;
      min-width: 0;
    }
    .search-bar:focus-within {
      border-color: var(--teal);
      box-shadow: 0 0 0 3px var(--teal-dim), 0 2px 8px rgba(13,60,100,0.12);
    }

    .search-bar input {
      flex: 1; border: none; outline: none;
      background: transparent; font-size: 14px; color: var(--text);
      width: 100%;
    }
    .search-bar input::placeholder { color: var(--text3); }

    .search-icon { color: var(--text3); flex-shrink: 0; }

    .icon-btn {
      background: transparent; border: none;
      color: var(--text2); cursor: pointer;
      padding: 4px; display: none; align-items: center;
      transition: color 0.2s, transform 0.2s;
    }
    .icon-btn:hover { color: var(--text); }
    .icon-btn:active { transform: scale(0.9); }

    .voice-btn {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--teal); 
      cursor: pointer;
      padding: 10px;
      display: flex; 
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      border-radius: var(--r-md);
      box-shadow: 0 2px 8px rgba(13,60,100,0.12);
      flex-shrink: 0;
    }
    .voice-btn:hover {
      background: var(--card2);
      border-color: var(--teal);
    }
    .voice-btn:active { 
      transform: scale(0.95); 
    }

    .filter-toggle {
      background: var(--card); 
      border: 1px solid var(--border);
      border-radius: var(--r-md); 
      padding: 10px;
      cursor: pointer; 
      display: flex; 
      align-items: center; 
      justify-content: center;
      transition: all 0.2s; 
      box-shadow: 0 2px 8px rgba(13,60,100,0.12);
      color: var(--text2);
    }
    .filter-toggle:hover {
      background: var(--card2); 
      border-color: var(--teal); 
      color: var(--teal);
    }

    .filter-chips {
      position: absolute;
      top: 110px;
      left: 0;
      right: 0;
      display: flex; 
      gap: 8px;
      padding: 12px 16px;
      overflow-x: auto; 
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      z-index: 99;
      pointer-events: auto;
    }
    .filter-chips::-webkit-scrollbar { display: none; }

    .chip {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 12px;
      background: var(--chip-bg-transport);
      color: var(--chip-color-transport);
      border-radius: var(--r-full);
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
      flex-shrink: 0;
      cursor: pointer;
      transition: opacity 0.2s;
      border: none;
      box-shadow: none;
    }
    .chip:hover { opacity: 0.85; }
    .chip.inactive {
      background: var(--card2);
      color: var(--text2);
      border: none;
      box-shadow: none;
    }
    .chip.inactive:hover { opacity: 0.85; }

    /*route header*/
    .route-header {
      position: absolute; top: 0; left: 0; right: 0;
      padding: 44px 20px 14px;
      background: var(--header-blur);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      z-index: 100;
      display: none;
      flex-direction: column;
      align-items: center;
      pointer-events: none;
    }
    .route-header > * { pointer-events: auto; }

    .route-nav-label {
      font-size: 10px; font-weight: 700;
      color: var(--text3); text-transform: uppercase; letter-spacing: 0.1em;
      margin-bottom: 4px;
    }
    .route-nav-path {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 15px; font-weight: 800; color: var(--text);
      letter-spacing: -0.2px; text-align: center;
      max-width: 300px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .route-nav-time {
      font-size: 12px; font-weight: 600; color: var(--teal);
      margin-top: 3px;
    }

    .route-stop-bar {
      position: absolute; bottom: 82px; left: 0; right: 0;
      display: none;
      justify-content: center;
      z-index: 100;
      pointer-events: none;
    }
    .route-stop-bar > * { pointer-events: auto; }
    .stop-btn {
      background: var(--red); color: #fff;
      border: none; border-radius: var(--r-full);
      padding: 13px 44px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 14px; font-weight: 800; letter-spacing: 0.02em;
      box-shadow: 0 4px 18px rgba(244,63,94,0.4);
      cursor: pointer;
      display: flex; align-items: center; gap: 8px;
      transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
    }
    .stop-btn:hover  { background: #e03050; box-shadow: 0 6px 24px rgba(244,63,94,0.5); }
    .stop-btn:active { transform: scale(0.96); }

    .suggestion-panel {
      position: absolute; bottom: 0; left: 0; right: 0;
      background: var(--card);
      border-radius: 24px 24px 0 0;
      padding: 16px 16px 100px;
      box-shadow: 0 -4px 24px rgba(0,0,0,0.15);
      max-height: 60%; overflow-y: auto;
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(.34,1.56,.64,1);
      z-index: 50; display: none;
    }
    .suggestion-panel.show { transform: translateY(0); }

    .panel-handle {
      width: 40px; height: 4px;
      background: var(--border); border-radius: 2px;
      margin: 0 auto 20px;
    }

    .panel-title {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 20px; font-weight: 800;
      color: var(--text); margin-bottom: 16px;
    }

    /*route card*/
    .route-card {
      background: var(--card2);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      padding: 12px 14px; margin-bottom: 10px;
      cursor: pointer; transition: all 0.2s;
    }
    .route-card:hover {
      border-color: var(--teal);
      box-shadow: 0 4px 12px var(--teal-dim);
      transform: translateY(-2px);
    }
    .route-card:active { transform: scale(0.98); }

    .route-card-header {
      display: flex; align-items: center; gap: 12px;
      margin-bottom: 0;
    }

    .transport-icon {
      width: 48px; height: 48px;
      background: var(--teal-dim);
      border-radius: var(--r-md);
      display: flex; align-items: center; justify-content: center;
      color: var(--teal); flex-shrink: 0;
    }

    .route-card-info { flex: 1; min-width: 0; }

    .route-modes {
      font-size: 14px; font-weight: 700;
      color: var(--text); margin-bottom: 3px;
    }

    .route-meta {
      display: flex; align-items: center; gap: 12px;
      font-size: 13px; color: var(--text2);
    }

    .safety-score {
      background: var(--green-dim); color: var(--green);
      padding: 6px 12px; border-radius: var(--r-full);
      font-weight: 800; font-size: 15px; white-space: nowrap;
      flex-shrink: 0;
    }
    .safety-score.medium {
      background: var(--yellow-dim); color: #d97706;
    }
    .safety-score.low {
      background: var(--red-dim); color: var(--red);
    }

    .details-panel {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      background: var(--card);
      border-radius: 24px 24px 0 0;

      height: 42vh; 
      display: flex;
      flex-direction: column;
      z-index: 1000;
     
      transform: translateY(100%);
      transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
      visibility: hidden;
    }
    
    .details-panel.show {
      transform: translateY(0);
      visibility: visible;
      pointer-events: auto;
    }
    
    .details-scroll {
      flex: 1;
      overflow-y: auto;
      min-height: 0;
      padding: 0 16px 20px;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .details-scroll::-webkit-scrollbar { display: none; } 
    
    .details-footer {
      flex-shrink: 0;     
      padding: 16px 16px 24px;
      background: var(--card);
      border-top: 1px solid var(--border2);
      box-shadow: 0 -4px 10px rgba(0,0,0,0.05);
    }

    .safety-explanation {
      background: var(--teal-dim);
      border: 1px solid var(--border2);
      border-radius: 16px;
      
      padding: 24px 20px; 
      margin: 16px 0;
      
      box-shadow: 0 4px 15px rgba(30, 200, 200, 0.05);
    }
    .safety-explanation::-webkit-scrollbar { display: none; }

    .safety-explanation-title {
      color: var(--teal);
      font-weight: 800;
      font-size: 22px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .safety-explanation-text {
      color: var(--text-dim);
      font-size: 15px;
      line-height: 1.6; 
    }

    .route-details-list { margin-bottom: 20px; }

    .route-step {
      display: flex; gap: 12px;
      margin-bottom: 16px; padding-bottom: 16px;
      border-bottom: 1px solid var(--divider);
    }
    .route-step:last-child {
      border-bottom: none; padding-bottom: 0; margin-bottom: 0;
    }

    .step-icon {
      width: 36px; height: 36px;
      background: var(--icon-bg);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      color: var(--teal); flex-shrink: 0;
    }

    .step-content { flex: 1; }

    .step-title {
      font-size: 13px; font-weight: 600;
      color: var(--text); margin-bottom: 4px;
    }

    .step-description {
      font-size: 12px; color: var(--text2); line-height: 1.4;
    }

    .bottom-nav {
      position: absolute; bottom: 0; left: 0; right: 0;
      height: 72px; display: flex; align-items: stretch;
      background: var(--card);
      border-top: 1px solid var(--border);
      z-index: 200;
      transition: background 0.3s, border-color 0.3s;
    }
    .nav-btn {
      flex: 1; position: relative;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 4px;
      border: none; background: transparent;
      color: var(--text3); cursor: pointer;
      padding: 8px 0 12px;
      transition: color 0.2s, background 0.2s;
    }
    .nav-btn:hover  { color: var(--teal); background: var(--teal-dim); }
    .nav-btn:active { background: var(--card2); }
    .nav-btn.active { color: var(--teal); }
    .nav-btn.active::after {
      content: ''; position: absolute; bottom: 8px;
      width: 4px; height: 4px; border-radius: 50%; background: var(--teal);
    }
    .nav-label {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 9px; font-weight: 800; letter-spacing: 0.08em;
    }

    .toast {
      position: fixed; top: 60px; left: 50%;
      transform: translateX(-50%) translateY(-100px);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      padding: 12px 20px;
      box-shadow: 0 8px 32px rgba(13,60,100,0.16);
      display: flex; align-items: center; gap: 10px;
      opacity: 0;
      transition: all 0.3s cubic-bezier(.34,1.56,.64,1);
      z-index: 1000; max-width: 320px;
    }
    .toast.show {
      opacity: 1; transform: translateX(-50%) translateY(0);
    }
    .toast-dot {
      width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
    }
    .toast-dot.teal  { background: var(--teal); }
    .toast-dot.green { background: var(--green); }
    .toast-dot.red   { background: var(--red); }
    #toast-msg {
      font-size: 13px; font-weight: 600; color: var(--text);
    }


    /*voice btn*/
    .voice-btn.listening {
      background: var(--red-dim);
      border-color: var(--red);
      color: var(--red);
      animation: mic-pulse 1s ease-in-out infinite;
    }
    @keyframes mic-pulse {
      0%, 100% { box-shadow: 0 0 0 0 var(--red-dim); }
      50%       { box-shadow: 0 0 0 6px transparent; }
    }

    /*chip close icon*/
    .chip-close {
      margin-left: 2px;
      opacity: 0.7;
      flex-shrink: 0;
    }
    .chip:hover .chip-close { opacity: 1; }
    .chip-commuter {
      background: var(--chip-bg-commuter);
      color: var(--chip-color-commuter);
      border: none;
    }

    /*ilter modal overlay*/
    .filter-modal-overlay {
      position: absolute; inset: 0;
      background: rgba(7,20,36,0.55);
      backdrop-filter: blur(4px);
      z-index: 500;
      display: flex; align-items: flex-end;
      opacity: 0; pointer-events: none;
      transition: opacity 0.25s;
    }
    .filter-modal-overlay.open {
      opacity: 1; pointer-events: all;
    }

    .filter-modal {
      width: 100%;
      background: var(--card);
      border-radius: 24px 24px 0 0;
      padding: 12px 20px 32px;
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(.34,1.56,.64,1);
      max-height: 85%;
      overflow-y: auto;
      scrollbar-width: none;
    }
    .filter-modal-overlay.open .filter-modal { transform: translateY(0); }
    .filter-modal::-webkit-scrollbar { display: none; }

    .filter-modal-handle {
      width: 40px; height: 4px;
      background: var(--border); border-radius: 2px;
      margin: 0 auto 16px;
    }

    .filter-modal-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 20px;
    }

    .filter-modal-title {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 16px; font-weight: 800;
      color: var(--text); letter-spacing: -0.3px;
    }

    .filter-modal-close {
      width: 32px; height: 32px; border-radius: 50%;
      background: var(--icon-bg); border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; color: var(--text2);
      transition: background 0.2s, color 0.2s;
    }
    .filter-modal-close:hover { background: var(--red-dim); color: var(--red); }

    .filter-section-label {
      font-size: 11px; font-weight: 700;
      letter-spacing: 0.1em; color: var(--text3);
      text-transform: uppercase;
      margin-bottom: 12px;
      display: flex; align-items: center; gap: 8px;
    }
    .filter-section-hint {
      font-size: 10px; font-weight: 500;
      color: var(--text3); text-transform: none;
      letter-spacing: 0;
    }

    /* 3-column grid for options */
    .filter-option-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .filter-option {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 6px; padding: 12px 8px;
      background: var(--card2);
      border: 1.5px solid var(--border);
      border-radius: var(--r-md);
      cursor: pointer; color: var(--text2);
      font-size: 12px; font-weight: 600;
      font-family: 'DM Sans', sans-serif;
      transition: all 0.18s;
      text-align: center;
    }
    .filter-option:hover {
      border-color: var(--teal);
      color: var(--teal);
      background: var(--teal-dim);
    }
    .filter-option.active {
      background: var(--teal-dim);
      border-color: var(--teal);
      color: var(--teal);
      box-shadow: 0 0 0 2px var(--teal-glow);
    }

    .filter-apply-btn {
      width: 100%; padding: 14px;
      margin-top: 24px;
      background: var(--teal); color: #fff;
      border: none; border-radius: var(--r-md);
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 15px; font-weight: 800;
      cursor: pointer; letter-spacing: 0.02em;
      transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
      box-shadow: 0 4px 16px var(--teal-glow);
    }
    .filter-apply-btn:hover {
      background: var(--teal-light);
      box-shadow: 0 6px 24px var(--teal-glow);
      transform: translateY(-1px);
    }
    .filter-apply-btn:active { transform: scale(0.98); }

    .details-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 4px;
    }
    .details-back-btn {
      width: 32px; height: 32px; border-radius: 50%;
      background: var(--icon-bg); border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; color: var(--text2); flex-shrink: 0;
      transition: background 0.2s, color 0.2s;
    }
    .details-back-btn:hover { background: var(--teal-dim); color: var(--teal); }

    .coming-overlay.open { opacity: 1 !important; pointer-events: all !important; }
    .coming-overlay.open > div { transform: scale(1) !important; }
    
    .hidden { display: none !important; }
  </style>
</head>

<body>
  
<div class="phone">
  
  <div class="map-container">
    <!--OSM via Leaflet-->
    <div id="map"></div>
    
    <!--satate 1&2-->
    <div class="search-header" id="search-header">
      <div class="search-row">
        <div class="search-bar">
          <button class="icon-btn" id="back-btn" aria-label="Back">
            <svg class="icon-svg" width="20" height="20" viewBox="0 0 24 24">
              <path d="M19 12H5M12 19l-7-7 7-7"/>
            </svg>
          </button>
          
          <svg class="icon-svg search-icon" width="18" height="18" viewBox="0 0 24 24">
            <circle cx="11" cy="11" r="8"/>
            <path d="m21 21-4.35-4.35"/>
          </svg>
          
          <input 
            type="text" 
            id="destination-input" 
            placeholder="Input destination place"
            autocomplete="off"
          >
          
          <button class="icon-btn" id="clear-btn" aria-label="Clear">
            <svg class="icon-svg" width="18" height="18" viewBox="0 0 24 24">
              <line x1="18" y1="6" x2="6" y2="18"/>
              <line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>
        </div>
        
        <button class="voice-btn" id="voice-btn" aria-label="Voice input">
          <svg class="icon-svg" width="18" height="18" viewBox="0 0 24 24">
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
            <line x1="12" y1="19" x2="12" y2="23"/>
            <line x1="8" y1="23" x2="16" y2="23"/>
          </svg>
        </button>
        
        <button class="filter-toggle" id="filter-toggle" aria-label="Filters">
          <svg class="icon-svg" width="20" height="20" viewBox="0 0 24 24">
            <line x1="4" y1="6" x2="16" y2="6"/>
            <line x1="4" y1="12" x2="20" y2="12"/>
            <line x1="4" y1="18" x2="12" y2="18"/>
            <circle cx="17" cy="6" r="2"/>
            <circle cx="13" cy="18" r="2"/>
          </svg>
        </button>
      </div>
    </div>
    
    <!--rendered by renderChips() in explore.js -->
    <div class="filter-chips" id="filter-chips"></div>

    <!-- state 4: Route Header filled by Design.startNavigation() -->
    <div class="route-header" id="route-header">
      <div class="route-nav-label" id="route-nav-label">Taken Route</div>
      <div class="route-nav-path" id="route-nav-path">—</div>
      <div class="route-nav-time" id="route-nav-time">—</div>
    </div>

    <!--state 4: Stop button-->
    <div class="route-stop-bar" id="route-stop-bar">
      <button class="stop-btn" id="stop-route-btn">
        <svg class="icon-svg" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" stroke="none">
          <rect x="4" y="4" width="16" height="16" rx="2"/>
        </svg>
        Stop Route
      </button>
    </div>

    <!-- state 2: Suggested Routes Panelcards rendered by Design.loadRoutes() -->
    <div class="suggestion-panel" id="suggestion-panel">
      <div class="panel-handle"></div>
      <h2 class="panel-title">Suggested Routes</h2>
      <div id="route-cards-container"></div>
    </div>

    <!-- state 3: Route Details Panel filled by renderDetailsPanel() -->
    <div class="details-panel" id="details-panel">

      <div style="padding:14px 16px 0;flex-shrink:0;">
        <div class="panel-handle" style="margin-bottom:12px;"></div>
        <div class="details-header">
          <button class="details-back-btn" id="details-back-btn" aria-label="Back to routes">
            <svg class="icon-svg" width="18" height="18" viewBox="0 0 24 24">
              <path d="M19 12H5M12 19l-7-7 7-7"/>
            </svg>
          </button>
          <h2 class="panel-title" style="margin-bottom:0">Route Details</h2>
          <div style="width:32px;flex-shrink:0;"></div>
        </div>
      </div>

      <div class="details-scroll">
        <div class="safety-explanation" id="safety-explanation" style="margin-top:12px">
          <div class="safety-explanation-title" id="safety-exp-title"></div>
          <div class="safety-explanation-text" id="safety-exp-text"></div>
        </div>
        <div class="route-details-list" id="route-steps-list"></div>
      </div>

      <div class="details-footer">
        <button class="btn btn-primary btn-full" id="start-route-btn">
          <svg class="icon-svg" width="18" height="18" viewBox="0 0 24 24">
            <polygon points="5 3 19 12 5 21 5 3"/>
          </svg>
          Start Route
        </button>
      </div>

    </div>

    <nav class="bottom-nav" id="bottom-nav"></nav>
  </div>

  <div class="toast" id="ligtas-toast" role="status" aria-live="polite">
    <span class="toast-dot teal" id="toast-dot"></span>
    <span id="toast-msg">Notification</span>
  </div>

  <div class="coming-overlay" id="coming-overlay" style="position:absolute;inset:0;background:rgba(7,30,36,0.55);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:600;opacity:0;pointer-events:none;transition:opacity 0.2s;">
    <div style="background:var(--card);border:1px solid var(--border2);border-radius:var(--r-xl);padding:28px 28px 24px;display:flex;flex-direction:column;align-items:center;gap:10px;width:280px;text-align:center;transform:scale(0.92);transition:transform 0.25s cubic-bezier(.34,1.56,.64,1);">
      <div style="width:52px;height:52px;border-radius:50%;background:var(--teal-dim);border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;color:var(--teal);">
        <svg class="icon-svg" width="24" height="24" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      </div>
      <span style="background:var(--teal-dim);border:1px solid var(--border2);border-radius:var(--r-full);color:var(--teal);font-size:11px;font-weight:700;letter-spacing:0.08em;padding:4px 14px;text-transform:uppercase;">Beta Roadmap</span>
      <p style="font-family:'Plus Jakarta Sans',sans-serif;font-size:16px;font-weight:800;color:var(--text);letter-spacing:-0.3px;">Feature Coming Soon</p>
      <p style="font-size:13px;color:var(--text2);line-height:1.5;">This feature is actively being built and will be available in an upcoming Beta release.</p>
      <button id="coming-dismiss" style="margin-top:4px;width:100%;background:var(--teal);color:#fff;border:none;border-radius:var(--r-md);font-family:'Plus Jakarta Sans',sans-serif;font-size:14px;font-weight:700;padding:11px;cursor:pointer;">Got it!</button>
    </div>
  </div>
  
</div>


</body>
</html>
