<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Ligtas Safety Mode</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#136dec",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101822",
                    },
                    fontFamily: {
                        "display": ["Public Sans"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        .map-gradient-overlay {
            background: radial-gradient(circle at 30% 40%, rgba(34, 197, 94, 0.2) 0%, transparent 40%),
                        radial-gradient(circle at 70% 60%, rgba(234, 179, 8, 0.2) 0%, transparent 45%),
                        radial-gradient(circle at 50% 20%, rgba(239, 68, 68, 0.15) 0%, transparent 35%);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 antialiased">
<div class="relative flex h-screen w-full max-w-[430px] mx-auto flex-col bg-background-light dark:bg-background-dark overflow-hidden shadow-2xl">
<!-- Header -->
<div class="flex items-center bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-md p-4 pb-2 justify-between sticky top-0 z-50 border-b border-primary/10">
<div class="text-slate-900 dark:text-slate-100 flex size-12 shrink-0 items-center justify-start">
<span class="material-symbols-outlined text-2xl">menu</span>
</div>
<h2 class="text-slate-900 dark:text-slate-100 text-lg font-bold leading-tight tracking-tight flex-1 text-center">Ligtas Safety Mode</h2>
<div class="flex w-12 items-center justify-end">
<button class="relative flex size-10 items-center justify-center rounded-lg bg-transparent text-slate-900 dark:text-slate-100">
<span class="material-symbols-outlined text-2xl">notifications</span>
<span class="absolute top-2 right-2 size-2 bg-red-500 rounded-full border-2 border-background-dark"></span>
</button>
</div>
</div>
<div class="flex flex-col flex-1 relative">
<!-- Map Section -->
<div class="absolute inset-0 z-0">
<div class="w-full h-full bg-slate-200 dark:bg-slate-800 relative">
<img class="w-full h-full object-cover opacity-60 grayscale-[0.3]" data-alt="Interactive map of Manila with heat overlays" data-location="Manila, Philippines" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAyW9lVPnk_p1FYIYgURhWLWHwGxjKCQruSAhPzJDmP8jGeFOEUpjpZpPpU34fH0iVH7La0zyh3rkPhnyzP-HI0WbE0DKOhmxo5-HBJCeSpSpppMtyw_SjIcfQuDccUQzUE2egvh8IBKFsZYw2yOgLVBRYzMrR36ZL2EY-mVFRkAdjh8cXjao4zbeQrhDGPpTlmH729Hf-2mbyhTCXm8K1PHnPbbf3SwK2Plsrg8wty2ifthF3bu73MT9yIUMC-ZX0W-4qIpWURfCA"/>
<div class="absolute inset-0 map-gradient-overlay pointer-events-none"></div>
<!-- Flood Overlay markers -->
<div class="absolute top-1/4 left-1/3 flex flex-col items-center">
<div class="bg-primary/20 backdrop-blur-sm p-3 rounded-full animate-pulse border border-primary/40">
<span class="material-symbols-outlined text-primary text-xl">water_drop</span>
</div>
<span class="bg-background-dark/80 px-2 py-0.5 rounded text-[10px] mt-1">Ankle deep</span>
</div>
</div>
</div>
<!-- Floating Controls -->
<div class="relative z-10 flex flex-col h-full p-4 pointer-events-none">
<!-- Search Bar -->
<div class="pointer-events-auto">
<label class="flex flex-col w-full h-12 shadow-lg">
<div class="flex w-full flex-1 items-stretch rounded-xl h-full overflow-hidden bg-background-light dark:bg-slate-900 border border-primary/20">
<div class="text-slate-400 flex items-center justify-center pl-4">
<span class="material-symbols-outlined">search</span>
</div>
<input class="form-input flex w-full border-none bg-transparent focus:ring-0 text-base px-3 placeholder:text-slate-500" placeholder="Where are you going?"/>
<div class="flex items-center pr-4">
<span class="material-symbols-outlined text-primary">mic</span>
</div>
</div>
</label>
</div>
<!-- Toggle Switch Area -->
<div class="mt-4 pointer-events-auto flex justify-center">
<div class="flex h-11 w-full max-w-[280px] items-center justify-center rounded-xl bg-slate-200/80 dark:bg-slate-900/80 backdrop-blur-md p-1 border border-primary/10">
<label class="flex cursor-pointer h-full grow items-center justify-center overflow-hidden rounded-lg px-2 transition-all has-[:checked]:bg-background-light dark:has-[:checked]:bg-background-dark has-[:checked]:text-slate-400 text-slate-400 text-sm font-semibold">
<span class="truncate">Navigation</span>
<input class="hidden" name="mode-toggle" type="radio" value="Nav"/>
</label>
<label class="flex cursor-pointer h-full grow items-center justify-center overflow-hidden rounded-lg px-2 transition-all has-[:checked]:bg-primary has-[:checked]:text-white text-slate-400 text-sm font-semibold">
<span class="flex items-center gap-1.5"><span class="material-symbols-outlined text-lg">shield</span> Ligtas Mode</span>
<input checked="" class="hidden" name="mode-toggle" type="radio" value="Ligtas"/>
</label>
</div>
</div>
<!-- Map Tools -->
<div class="mt-auto flex flex-col items-end gap-3 pointer-events-auto pb-4">
<div class="flex flex-col gap-1 bg-background-light dark:bg-slate-900 rounded-xl shadow-lg border border-primary/10 overflow-hidden">
<button class="flex size-11 items-center justify-center text-slate-600 dark:text-slate-300 hover:bg-primary/10">
<span class="material-symbols-outlined">add</span>
</button>
<div class="h-[1px] bg-primary/10 mx-2"></div>
<button class="flex size-11 items-center justify-center text-slate-600 dark:text-slate-300 hover:bg-primary/10">
<span class="material-symbols-outlined">remove</span>
</button>
</div>
<button class="flex size-12 items-center justify-center rounded-xl bg-primary text-white shadow-lg">
<span class="material-symbols-outlined">my_location</span>
</button>
</div>
</div>
</div>
<!-- Legend / Quick Filters -->
<div class="flex gap-3 px-4 py-3 overflow-x-auto no-scrollbar relative z-20 bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-md border-t border-primary/10">
<button class="flex h-9 shrink-0 items-center justify-center gap-x-2 rounded-lg bg-primary/10 dark:bg-primary/20 border border-primary/30 px-3">
<span class="material-symbols-outlined text-primary text-lg">water_drop</span>
<p class="text-primary text-sm font-semibold">Flooding</p>
<span class="material-symbols-outlined text-primary/60 text-lg">expand_more</span>
</button>
<button class="flex h-9 shrink-0 items-center justify-center gap-x-2 rounded-lg bg-slate-200 dark:bg-slate-800 border border-transparent px-3">
<span class="material-symbols-outlined text-slate-500 text-lg">warning</span>
<p class="text-slate-600 dark:text-slate-300 text-sm font-medium">Crime Rate</p>
<span class="material-symbols-outlined text-slate-500 text-lg">expand_more</span>
</button>
<button class="flex h-9 shrink-0 items-center justify-center gap-x-2 rounded-lg bg-slate-200 dark:bg-slate-800 border border-transparent px-3">
<span class="material-symbols-outlined text-slate-500 text-lg">lightbulb</span>
<p class="text-slate-600 dark:text-slate-300 text-sm font-medium">Lighting</p>
<span class="material-symbols-outlined text-slate-500 text-lg">expand_more</span>
</button>
</div>
<!-- Safety Score Panel -->
<div class="bg-background-light dark:bg-slate-900 border-t border-primary/20 px-5 pt-6 pb-8 rounded-t-3xl shadow-[0_-10px_30px_rgba(0,0,0,0.3)] z-30">
<div class="w-12 h-1.5 bg-slate-300 dark:bg-slate-700 rounded-full mx-auto mb-4"></div>
<div class="flex items-center justify-between mb-4">
<div>
<p class="text-slate-500 text-xs font-bold uppercase tracking-wider mb-0.5">Current Area Status</p>
<h3 class="text-2xl font-bold">Makati Ave. <span class="text-slate-400 font-normal">Section</span></h3>
</div>
<div class="flex flex-col items-end">
<div class="bg-green-500/20 text-green-500 px-3 py-1.5 rounded-xl border border-green-500/30 flex items-center gap-1.5">
<span class="material-symbols-outlined text-lg fill-1">verified_user</span>
<span class="text-lg font-bold">88</span>
<span class="text-xs font-medium">/ 100</span>
</div>
<p class="text-[10px] text-green-500 mt-1 font-semibold">SAFE AREA</p>
</div>
</div>
<div class="grid grid-cols-3 gap-3">
<div class="bg-slate-100 dark:bg-slate-800/50 p-3 rounded-xl border border-slate-200 dark:border-slate-800">
<div class="flex items-center gap-1.5 mb-1">
<span class="material-symbols-outlined text-blue-400 text-sm">rainy</span>
<span class="text-[10px] font-bold text-slate-500">WATER</span>
</div>
<p class="text-sm font-bold">No Flooding</p>
</div>
<div class="bg-slate-100 dark:bg-slate-800/50 p-3 rounded-xl border border-slate-200 dark:border-slate-800">
<div class="flex items-center gap-1.5 mb-1">
<span class="material-symbols-outlined text-yellow-400 text-sm">visibility</span>
<span class="text-[10px] font-bold text-slate-500">LIGHTS</span>
</div>
<p class="text-sm font-bold">Well Lit</p>
</div>
<div class="bg-slate-100 dark:bg-slate-800/50 p-3 rounded-xl border border-slate-200 dark:border-slate-800">
<div class="flex items-center gap-1.5 mb-1">
<span class="material-symbols-outlined text-primary text-sm">group</span>
<span class="text-[10px] font-bold text-slate-500">CROWD</span>
</div>
<p class="text-sm font-bold">Moderate</p>
</div>
</div>
<button class="w-full mt-6 bg-primary text-white font-bold py-4 rounded-xl flex items-center justify-center gap-2 shadow-lg shadow-primary/20">
<span class="material-symbols-outlined">directions</span>
                    Start Safe Navigation
                </button>
</div>
<!-- Bottom Navigation -->
<div class="flex border-t border-primary/10 bg-background-light dark:bg-background-dark px-6 pb-8 pt-3 relative z-40">
<a class="flex flex-1 flex-col items-center justify-center gap-1 text-primary" href="#">
<span class="material-symbols-outlined text-2xl fill-1">map</span>
<p class="text-[10px] font-bold leading-normal tracking-wide">Map</p>
</a>
<a class="flex flex-1 flex-col items-center justify-center gap-1 text-slate-400" href="#">
<span class="material-symbols-outlined text-2xl">warning</span>
<p class="text-[10px] font-medium leading-normal tracking-wide">Alerts</p>
</a>
<a class="flex flex-1 flex-col items-center justify-center gap-1 text-slate-400" href="#">
<div class="bg-primary/10 p-2 -mt-6 rounded-full border-4 border-background-dark">
<span class="material-symbols-outlined text-primary text-3xl">add_circle</span>
</div>
<p class="text-[10px] font-medium leading-normal tracking-wide">Report</p>
</a>
<a class="flex flex-1 flex-col items-center justify-center gap-1 text-slate-400" href="#">
<span class="material-symbols-outlined text-2xl">history</span>
<p class="text-[10px] font-medium leading-normal tracking-wide">History</p>
</a>
<a class="flex flex-1 flex-col items-center justify-center gap-1 text-slate-400" href="#">
<span class="material-symbols-outlined text-2xl">account_circle</span>
<p class="text-[10px] font-medium leading-normal tracking-wide">Profile</p>
</a>
</div>
</div>
</body></html>
