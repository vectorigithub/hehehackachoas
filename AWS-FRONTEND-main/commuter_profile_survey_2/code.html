<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Commuter Profile Survey</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        "navy-blue": "#001F3F",
                        "soft-gray": "#E2E8F0",
                        "high-contrast-black": "#000000",
                        "background-white": "#FFFFFF",
                    },
                    fontFamily: {
                        "display": ["Public Sans", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style type="text/tailwindcss">
        body {
            font-family: 'Public Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
            background-color: #FFFFFF;
        }
        .radio-checked-icon {
            --radio-dot-svg: url('data:image/svg+xml,%3csvg viewBox=%270 0 16 16%27 fill=%27%23FFFFFF%27 xmlns=%27http://www.w3.org/2000/svg%27%3e%3ccircle cx=%278%27 cy=%278%27 r=%273%27/%3e%3c/svg%3e');
        }
        input[type="radio"]:checked {
            background-image: var(--radio-dot-svg);
            background-color: #001F3F;
            border-color: #001F3F;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-white text-high-contrast-black min-h-screen font-display">
<div class="relative flex h-full min-h-screen w-full flex-col max-w-[430px] mx-auto overflow-x-hidden border-x border-soft-gray shadow-sm">
<div class="flex items-center p-4 pb-2 justify-between">
<button class="text-high-contrast-black flex size-12 shrink-0 items-center justify-start focus:outline-none">
<span class="material-symbols-outlined text-2xl font-bold">arrow_back</span>
</button>
<h2 class="text-high-contrast-black text-lg font-extrabold leading-tight tracking-tight flex-1 text-center pr-12">Commuter Profile</h2>
</div>
<div class="flex flex-col gap-3 p-4">
<div class="flex gap-6 justify-between items-end">
<p class="text-high-contrast-black text-base font-bold leading-normal">Profile Setup</p>
<p class="text-slate-600 text-sm font-semibold">Step 1 of 4</p>
</div>
<div class="rounded-full bg-soft-gray h-2.5 overflow-hidden">
<div class="h-full rounded-full bg-navy-blue" style="width: 25%;"></div>
</div>
</div>
<div class="px-4 pt-6 pb-2">
<h1 class="text-high-contrast-black tracking-tight text-3xl font-black leading-tight">Tell us more about yourself</h1>
<p class="text-slate-800 text-base font-medium leading-relaxed mt-4">
                Selecting your commuter type helps us provide safer auto-route suggestions and disaster alerts tailored to your specific needs in the Philippines.
            </p>
</div>
<div class="flex flex-col gap-3 p-4 radio-checked-icon">
<label class="group flex items-center gap-4 rounded-xl border-2 border-soft-gray p-4 transition-all cursor-pointer has-[:checked]:border-navy-blue has-[:checked]:bg-navy-blue/5">
<input checked="" class="h-5 w-5 border-2 border-slate-400 bg-transparent text-navy-blue focus:ring-navy-blue focus:ring-offset-0" name="commuter-type" type="radio"/>
<div class="flex grow flex-col">
<p class="text-high-contrast-black text-base font-extrabold group-has-[:checked]:text-navy-blue">Woman</p>
<p class="text-slate-700 text-sm font-medium">Prioritize well-lit and high-traffic routes</p>
</div>
<span class="material-symbols-outlined text-slate-500 group-has-[:checked]:text-navy-blue font-semibold">person_2</span>
</label>
<label class="group flex items-center gap-4 rounded-xl border-2 border-soft-gray p-4 transition-all cursor-pointer has-[:checked]:border-navy-blue has-[:checked]:bg-navy-blue/5">
<input class="h-5 w-5 border-2 border-slate-400 bg-transparent text-navy-blue focus:ring-navy-blue focus:ring-offset-0" name="commuter-type" type="radio"/>
<div class="flex grow flex-col">
<p class="text-high-contrast-black text-base font-extrabold group-has-[:checked]:text-navy-blue">Student</p>
<p class="text-slate-700 text-sm font-medium">Access student fare alerts &amp; campus paths</p>
</div>
<span class="material-symbols-outlined text-slate-500 group-has-[:checked]:text-navy-blue font-semibold">school</span>
</label>
<label class="group flex items-center gap-4 rounded-xl border-2 border-soft-gray p-4 transition-all cursor-pointer has-[:checked]:border-navy-blue has-[:checked]:bg-navy-blue/5">
<input class="h-5 w-5 border-2 border-slate-400 bg-transparent text-navy-blue focus:ring-navy-blue focus:ring-offset-0" name="commuter-type" type="radio"/>
<div class="flex grow flex-col">
<p class="text-high-contrast-black text-base font-extrabold group-has-[:checked]:text-navy-blue">Minor</p>
<p class="text-slate-700 text-sm font-medium">Safety-first routing and guardian notifications</p>
</div>
<span class="material-symbols-outlined text-slate-500 group-has-[:checked]:text-navy-blue font-semibold">child_care</span>
</label>
<label class="group flex items-center gap-4 rounded-xl border-2 border-soft-gray p-4 transition-all cursor-pointer has-[:checked]:border-navy-blue has-[:checked]:bg-navy-blue/5">
<input class="h-5 w-5 border-2 border-slate-400 bg-transparent text-navy-blue focus:ring-navy-blue focus:ring-offset-0" name="commuter-type" type="radio"/>
<div class="flex grow flex-col">
<p class="text-high-contrast-black text-base font-extrabold group-has-[:checked]:text-navy-blue">Person with Disability</p>
<p class="text-slate-700 text-sm font-medium">Accessible ramps &amp; elevator-enabled paths</p>
</div>
<span class="material-symbols-outlined text-slate-500 group-has-[:checked]:text-navy-blue font-semibold">accessible</span>
</label>
<label class="group flex items-center gap-4 rounded-xl border-2 border-soft-gray p-4 transition-all cursor-pointer has-[:checked]:border-navy-blue has-[:checked]:bg-navy-blue/5">
<input class="h-5 w-5 border-2 border-slate-400 bg-transparent text-navy-blue focus:ring-navy-blue focus:ring-offset-0" name="commuter-type" type="radio"/>
<div class="flex grow flex-col">
<p class="text-high-contrast-black text-base font-extrabold group-has-[:checked]:text-navy-blue">LGBTQ+</p>
<p class="text-slate-700 text-sm font-medium">Inclusive safe spaces and community verified routes</p>
</div>
<span class="material-symbols-outlined text-slate-500 group-has-[:checked]:text-navy-blue font-semibold">diversity_1</span>
</label>
</div>
<div class="mt-auto p-4 flex flex-col gap-3 bg-white">
<button class="w-full bg-navy-blue hover:bg-black text-white font-extrabold py-4 rounded-xl transition-colors shadow-lg active:scale-[0.98]">
                Continue
            </button>
<button class="w-full bg-transparent text-slate-600 font-bold py-3 rounded-xl transition-colors">
                Skip for now
            </button>
</div>
<div class="h-8 bg-white"></div>
</div>

</body></html>
