<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>JeepneySafe Splash Screen</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script id="tailwind-config">
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        colors: {
          "primary": "#13ecda",
          "safety-orange": "#f97316",
          "navy-blue": "#0f172a",
          "background-light": "#f6f8f8",
          "background-dark": "#102220",
        },
        fontFamily: { "display": ["Plus Jakarta Sans"] },
        borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
      },
    },
  }
</script>
<style>
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    background: linear-gradient(135deg, #060d1a 0%, #0b1120 50%, #071018 100%);
  }
  .phone-frame {
    position: relative;
    width: 390px;
    height: 844px;
    border-radius: 44px;
    background: #101322;
    border: 2px solid rgba(255,255,255,0.08);
    box-shadow: 0 40px 100px rgba(0,0,0,0.7), 0 0 0 1px rgba(255,255,255,0.03) inset, 0 0 60px rgba(18,217,192,0.06);
    overflow: hidden;
    scrollbar-width: none;
    -ms-overflow-style: none;
    display: flex;
    flex-direction: column;
  }
  .phone-frame::-webkit-scrollbar { display: none; }
  @media (max-width: 430px) {
    body { background: #101322; align-items: flex-start; }
    .phone-frame { width: 100%; height: 100dvh; border-radius: 0; border: none; box-shadow: none; }
  }
  .topo-pattern {
    background-image: url(https://lh3.googleusercontent.com/aida-public/AB6AXuC8VwAWaWdA04atE_6kqS00NYSsLnfz8FsaIejp24wAJlIsdOA7pTP4ptBY_5yqs5EVgaTqsuh-oEgWhrn5-7_Bd0NABW72pYs4Ii6KGjxS29F52aKYqLTbx85qX-AF-I62oY7S3171UzdFGmG0iGfoEV4Z5MR1GZ6AZYEKpwDulJ4Wx0JJ-jpLVY2LVbkk0uICbyinOXXA3rZ9MyVgDFb6gITFiaPiICAVsorHTV2dQIPmHGUBTYYgpPYPbj9_6bCkmf4s4xLPiFc);
    opacity: 0.05;
  }

  /* ── Jeep track: absolutely positioned lane across the full phone width ── */
  #jeep-track {
    position: absolute;
    /* vertically centered in the upper portion, same visual spot as original w-64 h-40 */
    top: 50%;
    margin-top: -260px; /* pull it up so it sits where the original jeep sat */
    left: 0;
    width: 100%;
    height: 160px; /* same as original h-40 */
    pointer-events: none;
    overflow: visible;
  }

  /* The jeep itself — starts far left off screen */
  #jeepney-wrap {
    position: absolute;
    /* width matches original w-64 = 256px */
    width: 256px;
    height: 160px;
    top: 0;
    /* JS will set left to animate it */
    left: -300px;
  }

  /* Wheel spin animation — JS toggles animation-play-state */
  .wheel {
    animation: spinWheel 0.45s linear infinite;
    animation-play-state: paused;
  }
  @keyframes spinWheel { to { transform: rotate(360deg); } }

  /* Motion lines — JS toggles opacity */
  .motion-line-1,
  .motion-line-2 {
    opacity: 0;
    transition: opacity 0.15s;
  }

  /* Exhaust puffs — always animating, visible when moving */
  .exhaust-puff {
    position: absolute;
    left: -6px;
    bottom: 22px;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: rgba(148,163,184,0.5);
    opacity: 0;
    animation: puffAnim 0.9s ease-out infinite;
  }
  .exhaust-puff:nth-child(2) { animation-delay: 0.3s; }
  .exhaust-puff:nth-child(3) { animation-delay: 0.6s; }
  @keyframes puffAnim {
    0%   { transform: translateX(0)    scale(0.4); opacity: 0.7; }
    100% { transform: translateX(-30px) scale(2);  opacity: 0;   }
  }

  /* Progress bar */
  #progress-bar { transition: width 0.05s linear; }

  /* Fade-up for text blocks */
  .fade-up       { opacity:0; transform:translateY(16px); animation: fadeUp 0.6s ease forwards 0.3s; }
  .fade-up-delay { opacity:0; transform:translateY(16px); animation: fadeUp 0.6s ease forwards 0.65s; }
  @keyframes fadeUp { to { opacity:1; transform:translateY(0); } }

  /* Exit flash */
  #exit-flash {
    position: absolute; inset: 0;
    background: #13ecda;
    border-radius: inherit;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
    z-index: 99;
  }
</style>
</head>
<body class="font-display">
<div class="phone-frame items-center justify-center bg-white dark:bg-background-dark">

  <!-- Original topo background -->
  <div class="absolute inset-0 topo-pattern pointer-events-none"></div>

  <!-- ── JEEP TRACK (full-width lane so jeep can travel edge-to-edge) ── -->
  <div id="jeep-track">
    <div id="jeepney-wrap">
      <!-- Exhaust puffs (left side) -->
      <div class="exhaust-puff"></div>
      <div class="exhaust-puff"></div>
      <div class="exhaust-puff"></div>

      <!-- Motion lines -->
      <div class="motion-line-1 absolute h-1 bg-slate-200 rounded-full" style="width:28px; left:-32px; top:50%;"></div>
      <div class="motion-line-2 absolute h-1 bg-slate-200 rounded-full" style="width:18px; left:-28px; top:33%; opacity:0.5;"></div>

      <!-- Jeepney body — exact original markup -->
      <div class="jeepney-body w-full h-full bg-primary/20 rounded-xl border-4 border-navy-blue flex items-end p-2">
        <div class="w-full h-1/2 bg-white rounded-lg border-2 border-navy-blue flex justify-around items-center">
          <div class="w-8 h-8 bg-slate-100 border border-navy-blue rounded-sm"></div>
          <div class="w-8 h-8 bg-slate-100 border border-navy-blue rounded-sm"></div>
          <div class="w-8 h-8 bg-slate-100 border border-navy-blue rounded-sm"></div>
        </div>
        <div class="headlight absolute -right-2 bottom-6 w-4 h-4 bg-yellow-300 rounded-full border-2 border-navy-blue"></div>
      </div>

      <!-- Rear wheel — exact original -->
      <div class="wheel absolute -bottom-4 left-8 w-10 h-10 rounded-full" style="background: radial-gradient(circle at 35% 35%, #475569 0%, #0f172a 60%); border: 4px solid #cbd5e1;">
        <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:6px;height:6px;background:#cbd5e1;border-radius:50%;"></div>
        <div style="position:absolute;top:50%;left:50%;width:100%;height:2px;background:rgba(203,213,225,0.4);transform:translate(-50%,-50%) rotate(0deg);transform-origin:center;"></div>
        <div style="position:absolute;top:50%;left:50%;width:100%;height:2px;background:rgba(203,213,225,0.4);transform:translate(-50%,-50%) rotate(60deg);transform-origin:center;"></div>
        <div style="position:absolute;top:50%;left:50%;width:100%;height:2px;background:rgba(203,213,225,0.4);transform:translate(-50%,-50%) rotate(120deg);transform-origin:center;"></div>
      </div>

      <!-- Front wheel — exact original -->
      <div class="wheel absolute -bottom-4 right-8 w-10 h-10 rounded-full" style="background: radial-gradient(circle at 35% 35%, #475569 0%, #0f172a 60%); border: 4px solid #cbd5e1;">
        <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:6px;height:6px;background:#cbd5e1;border-radius:50%;"></div>
        <div style="position:absolute;top:50%;left:50%;width:100%;height:2px;background:rgba(203,213,225,0.4);transform:translate(-50%,-50%) rotate(0deg);transform-origin:center;"></div>
        <div style="position:absolute;top:50%;left:50%;width:100%;height:2px;background:rgba(203,213,225,0.4);transform:translate(-50%,-50%) rotate(60deg);transform-origin:center;"></div>
        <div style="position:absolute;top:50%;left:50%;width:100%;height:2px;background:rgba(203,213,225,0.4);transform:translate(-50%,-50%) rotate(120deg);transform-origin:center;"></div>
      </div>
    </div>
  </div>

  <!-- ── Original centered content block (title + road line) ── -->
  <div class="relative flex flex-col items-center justify-center w-full max-w-sm px-8 fade-up">
    <!-- Spacer to reserve space where jeep sits above -->
    <div class="w-64 h-40 mb-12"></div>

    <div class="road-line w-48 h-1 bg-primary/20 rounded-full mb-16"></div>

    <div class="flex flex-col items-center gap-2 fade-up-delay">
      <div class="flex items-center gap-2">
        <h1 class="text-navy-blue dark:text-slate-100 text-4xl font-bold tracking-tight">JeepneySafe</h1>
        <span class="material-symbols-outlined text-safety-orange text-3xl" style="font-variation-settings: 'FILL' 1">warning</span>
      </div>
      <p class="text-slate-500 dark:text-slate-400 text-sm font-medium tracking-widest uppercase">Safety First Navigation</p>
    </div>
  </div>

  <!-- ── Original progress block ── -->
  <div class="absolute bottom-16 w-full max-w-xs px-8 flex flex-col gap-4 fade-up-delay">
    <div class="flex justify-between items-end">
      <p id="status-text" class="text-navy-blue dark:text-slate-200 text-xs font-semibold">Synchronizing routes...</p>
      <p id="progress-label" class="text-navy-blue dark:text-slate-200 text-xs font-bold">0%</p>
    </div>
    <div class="w-full h-2 bg-primary/20 rounded-full overflow-hidden">
      <div id="progress-bar" class="progress-bar h-full bg-primary rounded-full" style="width: 0%;"></div>
    </div>
    <div class="flex items-center justify-center gap-2 mt-4">
      <span class="material-symbols-outlined text-primary text-lg">verified_user</span>
      <p class="text-slate-400 text-[10px] font-medium uppercase tracking-tighter">Official Disaster Preparedness Tool</p>
    </div>
  </div>

  <!-- Original bottom city silhouette -->
  <div class="absolute bottom-0 left-0 w-full h-32 opacity-10 pointer-events-none">
    <div class="w-full h-full bg-cover bg-center" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDkqF3UEANGwyBAfsrzW0cTLMfZeWYS5DauLTIpMdVoyvO4RSw9tKB_kmq4HLgIzzGEloOWalMudH41AtrBK1B6ow3M0a_zUE8ONwTukhJfBkknNzkZrMCP1f_RYaT74P5EUhKZHigNc3JsYnCK0R9u7bzLUi3N7NGpoAngU_dnHPUzWCUMjnrSqgwgmt1hngIwiMGSN0rNT0S0fKeglx_GdjZiLCvV8YjEbxbAL_b7xAHKhlVSmmcNH34IRkRSHDqg9smGSZGIf4k');"></div>
  </div>

  <!-- Exit flash overlay -->
  <div id="exit-flash"></div>

</div>
<script src="../../splash.js"></script>
</body></html>
