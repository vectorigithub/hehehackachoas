<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>SafeCommute - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#2547f4",
                        "background-light": "#f5f6f8",
                        "background-dark": "#101322",
                    },
                    fontFamily: {
                        "display": ["Inter"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
    body {
      font-family: 'Inter', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #060d1a 0%, #0b1120 50%, #071018 100%);
    }
    .hero-gradient {
      background: linear-gradient(to bottom, transparent 0%, transparent 60%, #101322 100%);
    }
    .phone-frame {
      position: relative;
      width: 390px;
      height: 844px;
      border-radius: 44px;
      background: #101322;
      border: 2px solid rgba(255,255,255,0.08);
      box-shadow: 0 40px 100px rgba(0,0,0,0.7), 0 0 0 1px rgba(255,255,255,0.03) inset, 0 0 60px rgba(18,217,192,0.06);
      overflow-y: scroll;
      overflow-x: hidden;
      scrollbar-width: none;
      -ms-overflow-style: none;
      display: flex;
      flex-direction: column;
    }
    .phone-frame::-webkit-scrollbar { display: none; }
    @media (max-width: 430px) {
      body { background: #101322; align-items: flex-start; }
      .phone-frame {
        width: 100%;
        height: 100dvh;
        border-radius: 0;
        border: none;
        box-shadow: none;
      }
    }
  </style>
</head>
<body class="dark text-slate-100 font-display">
<div class="phone-frame relative flex flex-col">
<!-- Hero Section -->
<div class="relative w-full overflow-hidden shrink-0 h-[42%]">
<div class="absolute inset-0 bg-cover bg-center" data-alt="Blurred neon city street at night with car lights" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuCmhrrybYG_Bn0ExlPWJFvrghVzPZpLGLfoLnS0QfEWx_HLV16NjOStcxIioafNwJmozQzJyVGaDGL8-1QkiEi-55YUiLqQketA1rG050k2PKAkHmu-2ZB8tIQaUuU7AZLZabtq-ItiC5YJ2baa5Zi-Yxffzl6xnwBoLEQWb97PhLNIeAyHkAf9fD7EJsw_qe-HhX3sf7TJwlL3NF9DkA_siu6R_EadYKrhxEpXMGLBMiY5S-cMMUfYImW32HCXnyl80iVhw5Q6qVHK');">
</div>
<!-- Exponential Gradient Fade -->
<div class="absolute inset-0 hero-gradient" style="background: linear-gradient(to bottom, rgba(16, 19, 34, 0) 0%, rgba(16, 19, 34, 0.2) 50%, rgba(16, 19, 34, 0.6) 75%, rgba(16, 19, 34, 0.9) 90%, rgba(16, 19, 34, 1) 100%);"></div>
<!-- Branding Overlay -->
<div class="absolute inset-0 flex flex-col justify-between p-6 pt-8">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-2xl">shield_person</span>
<h1 class="text-lg font-bold tracking-tight">SafeCommute PH</h1>
</div>
<div class="pb-4">
<h2 class="text-3xl font-extrabold leading-[1.1] tracking-tight text-white">Stay Safe,<br/>Commute Better.</h2>
</div>
</div>
</div>
<!-- Auth Toggle -->
<div class="px-6 py-5">
<div class="flex h-12 w-full items-center justify-center rounded-xl bg-slate-800/50 p-1 border border-slate-700/50">
<label id="tab-login-label" class="flex cursor-pointer h-full grow items-center justify-center overflow-hidden rounded-lg px-2 bg-primary text-white text-sm font-semibold transition-all">
<span>Log In</span>
<input id="tab-login" checked="" class="hidden" name="auth-mode" type="radio" value="login"/>
</label>
<label id="tab-register-label" class="flex cursor-pointer h-full grow items-center justify-center overflow-hidden rounded-lg px-2 text-slate-400 text-sm font-medium hover:text-slate-200 transition-all">
<span>Register</span>
<input id="tab-register" class="hidden" name="auth-mode" type="radio" value="register"/>
</label>
</div>
</div>
<!-- Login Form -->
<form id="login-form" class="flex flex-col gap-4 px-6 pt-1">
<div class="flex flex-col gap-2"><label class="text-xs font-medium text-slate-400 ml-1 mb-1 uppercase tracking-wider">Email or Username</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-400">alternate_email</span>
<input id="login-identifier" class="w-full rounded-xl border border-slate-700 bg-slate-800/20 py-4 pl-12 pr-4 text-slate-100 placeholder:text-slate-600 focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-all" placeholder="your@email.com" type="text"/>
</div></div>
<div class="flex flex-col gap-2"><label class="text-xs font-medium text-slate-400 ml-1 mb-1 uppercase tracking-wider">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-400">lock</span>
<input id="login-password" class="w-full rounded-xl border border-slate-700 bg-slate-800/20 py-4 pl-12 pr-12 text-slate-100 placeholder:text-slate-600 focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-all" placeholder="••••••••" type="password"/>
<span class="toggle-password material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 cursor-pointer">visibility</span>
</div></div>
<div class="flex justify-end">
<a class="text-sm font-medium text-primary hover:underline" href="#">Forgot Password?</a>
</div>
<button class="flex w-full items-center justify-center gap-2 rounded-xl bg-primary py-4.5 text-base font-semibold text-white shadow-lg shadow-primary/20 active:scale-[0.98] transition-all" type="submit">
<span>Log In</span>
<span class="material-symbols-outlined">arrow_forward</span>
</button>
</form>

<!-- Register Form -->
<form id="register-form" class="flex flex-col gap-4 px-6 pt-1" style="display:none;">
<div class="flex flex-col gap-2"><label class="text-xs font-medium text-slate-400 ml-1 mb-1 uppercase tracking-wider">Full Name</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-400">person</span>
<input id="reg-fullname" class="w-full rounded-xl border border-slate-700 bg-slate-800/20 py-4 pl-12 pr-4 text-slate-100 placeholder:text-slate-600 focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-all" placeholder="Juan dela Cruz" type="text"/>
</div></div>
<div class="flex flex-col gap-2"><label class="text-xs font-medium text-slate-400 ml-1 mb-1 uppercase tracking-wider">Email</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-400">alternate_email</span>
<input id="reg-email" class="w-full rounded-xl border border-slate-700 bg-slate-800/20 py-4 pl-12 pr-4 text-slate-100 placeholder:text-slate-600 focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-all" placeholder="your@email.com" type="email"/>
</div></div>
<div class="flex flex-col gap-2"><label class="text-xs font-medium text-slate-400 ml-1 mb-1 uppercase tracking-wider">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-400">lock</span>
<input id="reg-password" class="w-full rounded-xl border border-slate-700 bg-slate-800/20 py-4 pl-12 pr-12 text-slate-100 placeholder:text-slate-600 focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-all" placeholder="Min. 8 characters" type="password"/>
<span class="toggle-password material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 cursor-pointer">visibility</span>
</div></div>
<div class="flex flex-col gap-2"><label class="text-xs font-medium text-slate-400 ml-1 mb-1 uppercase tracking-wider">Confirm Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-400">lock_reset</span>
<input id="reg-confirm-password" class="w-full rounded-xl border border-slate-700 bg-slate-800/20 py-4 pl-12 pr-12 text-slate-100 placeholder:text-slate-600 focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-all" placeholder="••••••••" type="password"/>
<span class="toggle-password material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 cursor-pointer">visibility</span>
</div></div>
<button class="flex w-full items-center justify-center gap-2 rounded-xl bg-primary py-4.5 text-base font-semibold text-white shadow-lg shadow-primary/20 active:scale-[0.98] transition-all" type="submit">
<span>Create Account</span>
<span class="material-symbols-outlined">arrow_forward</span>
</button>
</form>
<!-- Social Login -->
<div class="mt-auto flex flex-col gap-4 px-6 pb-2">
<div class="relative flex items-center py-2">
<div class="flex-grow border-t border-slate-800"></div>
<span class="mx-4 flex-shrink text-xs font-medium uppercase tracking-widest text-slate-500">Or continue with</span>
<div class="flex-grow border-t border-slate-800"></div>
</div>
<div class="grid grid-cols-2 gap-4">
<button data-provider="google" class="social-login-btn flex items-center justify-center gap-2 rounded-xl border border-slate-700 bg-slate-800/30 py-3 text-sm font-medium hover:bg-slate-800/50 transition-all">
<svg class="h-5 w-5" viewbox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="currentColor"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="currentColor"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="currentColor"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="currentColor"></path>
</svg>
                    Google
                </button>
<button data-provider="apple" class="social-login-btn flex items-center justify-center gap-2 rounded-xl border border-slate-700 bg-slate-800/30 py-3 text-sm font-medium hover:bg-slate-800/50 transition-all">
<svg class="h-5 w-5" viewbox="0 0 24 24">
<path d="M17.05 20.28c-.98.95-2.05.88-3.08.4c-1.09-.5-2.08-.48-3.24 0-1.44.62-2.2.44-3.06-.4C4.38 17.06 4.1 11.83 6.64 10.03c1.23-.88 2.6-.9 3.36-.4.92.38 1.48.5 2.38 0 .68-.38 2.38-.6 3.52.44 1.2.66 2.06 2.1 2.06 2.1-.04.06-1.58 1.84-1.58 3.82 0 2.4 1.48 3.5 1.5 3.52-.04.1-3.02 8.78-7.77 10.77zM12.03 5.43c-.1 2.3 1.9 4.3 4.14 4.22.24-2.42-2.1-4.42-4.14-4.22z" fill="currentColor"></path>
</svg>
                    Apple
                </button>
</div>
</div>
</div>
<script src="log_reg.js"></script>

</body></html>
